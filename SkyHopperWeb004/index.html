<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Sky Hopper</title>
    <!-- Unity favicon o'rniga bo'sh ikonka -->
    <link rel="icon" href="data:,">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #game { position: fixed; inset: 0; background: #000; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; }
      /* Logosiz, ingichka yuklanish chizig'i */
      #loading { position: absolute; left: 50%; top: 50%; width: min(60vw, 320px); transform: translate(-50%, -50%); }
      #bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
      #fill { height: 100%; width: 0%; border-radius: 3px; background: #FFD27A; transition: width 0.15s; }
      #warning { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); font: 14px sans-serif; color: #000; display: none; }
    </style>
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><div id="bar"><div id="fill"></div></div></div>
      <div id="warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 8px 12px; margin-bottom: 4px; border-radius: 4px; background: " + (type == "error" ? "#f55" : "#fd5") + ";";
        banner.appendChild(div);
        banner.style.display = "block";
        if (type != "error") {
          setTimeout(function () {
            banner.removeChild(div);
            if (!banner.children.length) banner.style.display = "none";
          }, 5000);
        }
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/SkyHopperWeb004.data.unityweb",
        frameworkUrl: buildUrl + "/SkyHopperWeb004.framework.js.unityweb",
        codeUrl: buildUrl + "/SkyHopperWeb004.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "game",
        companyName: "DefaultCompany",
        productName: "Sky Hopper",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/SkyHopperWeb004.loader.js";
      script.onload = function () {
        var loading = document.querySelector("#loading");
        var fill = document.querySelector("#fill");
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          loading.style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
